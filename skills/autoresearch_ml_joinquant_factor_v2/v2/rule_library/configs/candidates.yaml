# 针对"池子=全小票"场景的第一批候选策略。
# base_filters 在加载时由 small_cap_base.yaml 注入，无需在此重复。
#
# 关键量纲:
#   roe_ttm / 毛利率 / 增速 / 债务率  — 小数 (0.12 = 12%)
#   fifty_two_week_close_rank        — 整数 1-250（≈交易日位次，越大越接近 52w 高点）
#   share_turnover_monthly           — z-score（-3~+2）
#   MAC60                            — 价格/MA 比值，>1 即站上均线
#   Rank1M                           — 0-1 分位

strategies:

  - name: 小票·质量成长
    soft_filters:
      - {op: gt, column: EPS, value: 0.5}
      - {op: gt, column: ROE, value: 0.12}
      - {op: gt, column: 营收增速, value: 0.20}
    sort_by: {column: 近一月动量, ascending: false}
    n_stocks: 30
    rebalance_weeks: 1
    meta: {tree: B_quality_growth, branch: B2+B5}

  - name: 小票·戴维斯双击
    soft_filters:
      - {op: between, column: PEG, low: 0, high: 1.0}
      - {op: gt, column: 净利润增速, value: 0.20}
    sort_by: {column: 近一月动量, ascending: false}
    n_stocks: 30
    rebalance_weeks: 1
    meta: {tree: H_composite, branch: H1}

  - name: 小票·错杀修复
    soft_filters:
      - {op: gt, column: EPS, value: 0.1}
      - {op: gt, column: 净利润增速, value: 0}
      - {op: lt, column: 52周位置, value: 100}     # 位次<100 = 位于 52w 低位区
    sort_by: {column: MAC60, ascending: false}
    n_stocks: 30
    rebalance_weeks: 1
    meta: {tree: D_mispricing_reversal, branch: D2+D3}

  - name: 小票·质量筹码
    soft_filters:
      - {op: gt, column: EPS, value: 0.3}
      - {op: gt, column: 毛利率, value: 0.30}
      - {op: between, column: 月换手率, low: -1.0, high: 1.0}   # z-score 中等活跃
    sort_by: {column: 近一月动量, ascending: false}
    n_stocks: 30
    rebalance_weeks: 1
    meta: {tree: F_fund_flow, branch: F1+B3}

  - name: 小票·技术动量
    soft_filters:
      - {op: gt, column: EPS, value: 0.3}
      - {op: gt, column: MAC60, value: 1.0}        # 站上 60 日均线
      - {op: gt, column: 52周位置, value: 200}      # 位次>200 = 靠近 52w 高点
      - {op: between, column: 月换手率, low: -0.5, high: 1.5}
    sort_by: {column: 近一月动量, ascending: false}
    n_stocks: 30
    rebalance_weeks: 1
    meta: {tree: E_technical_trend, branch: E1+E4}

  - name: 小票·两阶段 Top10%→EPS>0.5
    stage1_top_pct: 0.10
    stage1_sort: {column: 近一月动量, ascending: false}
    soft_filters:
      - {op: gt, column: EPS, value: 0.5}
    sort_by: {column: 近一月动量, ascending: false}
    n_stocks: 50
    rebalance_weeks: 1
    meta: {tree: H_composite, branch: baseline_from_prior_research}
